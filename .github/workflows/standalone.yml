name: Archived Standalone validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Dependency audit
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.vulnerabilities,null,2))'
      - name: Typecheck
        run: node scripts/run.mjs typecheck
      - name: Controlled tests
        run: npm test
      - name: Build
        run: node scripts/run.mjs build
      - name: Browser install
        run: npx playwright install --with-deps chromium
      - name: Mobile workspace
        run: npx playwright test
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-evidence
          path: |
            app/test-results/
            app/playwright-report/
            app/package-lock.json
            app/audit.json
