name: Verified release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Controlled wallet, credit, receipt, restart and HTTP checks
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit
        run: npm audit
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Compute, workspace and context at 1440px, 390px and 320px
        run: npx playwright test --config playwright.compute.config.ts
      - name: Portable source
        if: always()
        run: tar --exclude=node_modules --exclude=data --exclude=dist --exclude=test-results --exclude=playwright-report --exclude=.env -czf ../verified-release-source.tar.gz .
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-evidence
          path: |
            release/test-results/
            release/playwright-report/
            release/package-lock.json
            verified-release-source.tar.gz
